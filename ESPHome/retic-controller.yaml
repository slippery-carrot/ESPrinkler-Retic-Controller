###################################
sensor:

  # Wifi signal strength in dB
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    entity_category: "diagnostic"
  
  # Wifi signal in %
  - platform: copy # Reports the WiFi signal strength in %
    name: "WiFi Signal Percent"
    source_id: wifi_signal_db
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
  
  # Device uptime
  - platform: uptime
    name: Uptime
    entity_category: "diagnostic"

  # Calculates and exposes the total watering duration a of current cycle

  # Program 1 
  - platform: template
    name: "Program 1 Total Watering Duration"
    id: prog1_total_watering_duration
    icon: "mdi:timer-outline"
    unit_of_measurement: "min"
    update_interval: $sensor_update_frequency
    lambda: |-
      auto sprinkler = id(esprinkler_prog1);

      if (sprinkler->time_remaining_current_operation().has_value()) {

        float val = sprinkler->time_remaining_current_operation().value() / 60.0; // Convert seconds to minutes;

        return val;
      } else {
        return 0; // No active cycle
      }

  # Program 2
  - platform: template
    name: "Program 2 Total Watering Duration"
    id: prog2_total_watering_duration
    icon: "mdi:timer-outline"
    unit_of_measurement: "min"
    update_interval: $sensor_update_frequency
    lambda: |-
      auto sprinkler = id(esprinkler_prog2);

      if (sprinkler->time_remaining_current_operation().has_value()) {

        float val = sprinkler->time_remaining_current_operation().value() / 60.0; // Convert seconds to minutes;

        return val;
      } else {
        return 0; // No active cycle
      }

  # Program 3
  - platform: template
    name: "Program 3 Total Watering Duration"
    id: prog3_total_watering_duration
    icon: "mdi:timer-outline"
    unit_of_measurement: "min"
    update_interval: $sensor_update_frequency
    lambda: |-
      auto sprinkler = id(esprinkler_prog3);

      if (sprinkler->time_remaining_current_operation().has_value()) {

        float val = sprinkler->time_remaining_current_operation().value() / 60.0; // Convert seconds to minutes;

        return val;
      } else {
        return 0; // No active cycle
      }


  # Expose the currently running zone as a number (0 = None)
  - platform: template
    name: "Currently Running Zone"
    id: currently_running_zone
    icon: "mdi:sprinkler"
    accuracy_decimals: 0
    update_interval: $sensor_update_frequency
    lambda: |-
      // Return the number of the first active zone.
      if (id(esprinkler_valve_sw1).state) return 1.0f;
      if (id(esprinkler_valve_sw2).state) return 2.0f;
      if (id(esprinkler_valve_sw3).state) return 3.0f;
      if (id(esprinkler_valve_sw4).state) return 4.0f;
      if (id(esprinkler_valve_sw5).state) return 5.0f;
      if (id(esprinkler_valve_sw6).state) return 6.0f;
      if (id(esprinkler_valve_sw7).state) return 7.0f;
      if (id(esprinkler_valve_sw8).state) return 8.0f;

      // No zone running.
      return 0.0f;

