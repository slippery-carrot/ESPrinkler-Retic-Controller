# ================================================================
# ESPrinkler Reticulation Controller
# ---------------------------------------------------------------
# Project:       ESPHome-based Sprinkler Controller
# Description:   Controls 8 irrigation zones + main valve
#                - Configurable via Home Assistant
#                - Independent operation in case of Wi-Fi loss
#                - Adjustable sprinkler schedules for up to 3 separate programs
# Author:        Alexander Lauderdale
# GitHub:        https://github.com/slippery-carrot/ESPrinkler-Retic-Controller
# Version:       2.1.0
# Date:          2026-05-26
# ================================================================


###################################
# Substitutions 
###################################
substitutions:

  # Sensor update frequency
  sensor_update_frequency: 5s # Set how often the more critical sensors update, sensors with an interval not defined default to 60s

  # Interval for saving to flash
  flash_save_interval: 1min # Set how often variables are saved to flash
  
  # Keys and passwords
  api_key: !secret esprinkler_api_key # API key
  ota_password: !secret esprinkler_ota_password  # Over-the-air password
  ap_password: !secret esprinkler_ap_password   # Wi-fi AP password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  web_server_username: !secret esprinkler_ws_username
  web_server_password: !secret esprinkler_ws_password


  # Status LEDs GPIO assignments
  status_led_gpio: GPIO27
  wifi_led_gpio: GPIO14

  # Sprinkler Component variables
  duration_entity_mode: SLIDER  # Changes the integration input mode, recommend BOX or SLIDER 
  valve_overlap_setting: 3s     # Set the overlap between two valves, helps reduce banging
  pump_start_delay_setting: 3s  # Set the delay from when a zone valve opens, and the main valve opens
  pump_stop_delay_setting: 3s   # Set the delay from when the pump is turned off to when the last valve closes to reduce pressure in the line
  repeat_cycle_initial: '0'     # Configure the initial setting for the repeat cycles
  repeat_cycle_max: '5'         # Configure the max setting for the repeat cycles
  repeat_cycle_min: '0'         # Configure the min setting for the repeat cycles

  # Valve & Pump (Main Valve) GPIO's
  # Enter the GPIO assignments for the pump and each zone below
  pump_gpio: GPIO17
  zone_1_gpio: GPIO5
  zone_2_gpio: GPIO18
  zone_3_gpio: GPIO19
  zone_4_gpio: GPIO21
  zone_5_gpio: GPIO3
  zone_6_gpio: GPIO1
  zone_7_gpio: GPIO22
  zone_8_gpio: GPIO23


  # True if your relay board is active low (GND trigger)
  # False if your relay board is active high (VCC trigger)
  relay_inversion: 'False'

  # Version info
  esprinkler_sw_version: "V1.1.0"

  # Names and name IDs
  project_author: "Alexander Lauderdale"
  name_of_device: "esprinkler-retic-controller"   # Name of the device
  name_of_project: esprinkler                   # Name of the project
  namespace_of_project: ${project_author}.${name_of_device}
  friendly_name: "ESPrinkler Retic Controller"  # Friendly name

###################################
# Global variables
###################################
globals:
  # Program 1 "skip-next-day" target date (YYYY-MM-DD). 0 means unset.
  - id: prog1_skip_year
    type: int
    restore_value: yes
    initial_value: '0'
  - id: prog1_skip_month
    type: int
    restore_value: yes
    initial_value: '0'
  - id: prog1_skip_day
    type: int
    restore_value: yes
    initial_value: '0'

  # Milestone 1: RAM-only guard against two start requests in the same minute.
  # Never write the minute-by-minute scheduler state to flash.
  - id: prog1_last_scheduled_start_minute
    type: int64_t
    restore_value: no
    initial_value: '-1'

  # Apply the same RAM-only duplicate-start guard to all three programs.
  - id: prog2_last_scheduled_start_minute
    type: int64_t
    restore_value: no
    initial_value: '-1'

  - id: prog3_last_scheduled_start_minute
    type: int64_t
    restore_value: no
    initial_value: '-1'


###################################
# Board setup
###################################
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

###################################
# ESPHome settings
###################################
esphome:
  name: $name_of_device
  friendly_name: $friendly_name
  project:
    name: $namespace_of_project
    version: $esprinkler_sw_version

  # Runs when device boots
  on_boot:
    priority: -100
    then:
      # Apply the restored indicator LED brightness after components initialise.
      - output.set_max_power:
          id: wifi_led_out
          max_power: !lambda |-
            return id(indicator_led_brightness).state / 100.0f;

      - output.set_max_power:
          id: status_led_out
          max_power: !lambda |-
            return id(indicator_led_brightness).state / 100.0f;

      # Refresh both indicators immediately using their existing status logic.
      - script.execute: update_status_led
      - script.execute: update_wifi_led

###################################
# ESP Preferences
###################################
preferences:
  # Flash write interval
  flash_write_interval: $flash_save_interval

###################################
# Enable logging
###################################
logger:
  level: INFO
###################################
# Enable Home Assistant API
###################################
api:
  encryption:
    key: $api_key

###################################
# Over the air updates
###################################
ota:
  platform: esphome
  id: my_ota
  password: $ota_password

###################################
# Wifi settings
###################################
wifi:
  ssid: $wifi_ssid
  password: $wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: $friendly_name
    password: $ap_password
        

###################################
# The captive portal component in ESPHome is a fallback mechanism for when connecting to the configured WiFi fails.
###################################
captive_portal:

###################################
# Web Server settings
###################################
web_server:
  port: 80
  auth:
    username: $web_server_username
    password: $web_server_password

###################################
# Output component
###################################
output:
  # Wi-Fi status LED - PWM controlled
  - platform: ledc
    pin: $wifi_led_gpio
    id: wifi_led_out
    frequency: 1220Hz
    inverted: false

  # Irrigation status LED - PWM controlled
  - platform: ledc
    pin: $status_led_gpio
    id: status_led_out
    frequency: 1220Hz
    inverted: false

#########################################
# Sprinkler components – Three Programs
#########################################
sprinkler:

  ###############
  # Program 1
  ###############

  - id: esprinkler_prog1
    main_switch:
      name: "Program 1 Start/Stop"
      restore_mode: ALWAYS_OFF
    auto_advance_switch:
      name: "Program 1 Auto Advance Switch"
      restore_mode: ALWAYS_ON
      entity_category: config
      internal: True # Do not expose entity to the frontend     
    valve_overlap: $valve_overlap_setting
    pump_start_pump_delay: $pump_start_delay_setting
    pump_stop_valve_delay: $pump_stop_delay_setting

    repeat_number:
      name: "Program 1 Repeat Cycles"
      id: repeat_cycles_prog1
      initial_value: $repeat_cycle_initial
      min_value: $repeat_cycle_min
      max_value: $repeat_cycle_max
      restore_value: True

    valves:
      # Zone 1 for Program 1
      - valve_switch:
          name: "Program 1 Zone 1 Switch"
          disabled_by_default: false
          restore_mode: RESTORE_DEFAULT_OFF
          entity_category: config
          internal: True # Do not expose entity to the frontend
        enable_switch:
          name: "Program 1 Zone 1 Enable"
          disabled_by_default: false
          restore_mode: RESTORE_DEFAULT_OFF
          entity_category: config
        run_duration_number:
          name: "Program 1 Zone 1 Duration"
          unit_of_measurement: min
          mode: $duration_entity_mode
          icon: mdi:timer-outline
          initial_value: 1
          min_value: 1
          max_value: 120
          step: 1
          restore_value: True
          entity_category: config
