###################################
# Select component 
###################################
select:

###################################
# Interval component
###################################
interval:

  # Interval every 10 seconds
  - interval: 10s
    then:
      # Log heartbeat
      - logger.log:
          tag: "interval"
          format: "Heartbeat"
          level: INFO

      # Run status LED scripts
      - script.execute: update_status_led
      - script.execute: update_wifi_led

  # Interval every 1 hour
  - interval: 1h
    then:
      - logger.log:
          tag: "interval"
          format: "Updating ESP32 time using HA time"
          level: INFO

      # Re-sync time with home assistant
      - component.update: ha_time # Update ESP32 time from HA

###################################
# Script Component
###################################

script:

  #######################
  # Native scheduler (Milestone 2)
  #######################
  # All 12 HA-configurable time inputs call this same routine. Validation is
  # local on the ESP32; no HA service call is needed when a schedule fires.
  # Concurrent triggers are serialized by immediate/synchronous checks in
  # each program's existing run script. No stacking or queueing here.
  - id: scheduler_evaluate_start
    mode: parallel
    max_runs: 12
    parameters:
      program: int
      slot: int
    then:
      - lambda: |-
          // Use the controller's locally held time.
          const auto now = id(ha_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("scheduler", "P%d slot %d skipped: invalid clock", program, slot);
            return;
          }

          // Assume disabled until the selected schedule is checked.
          bool program_enabled = false;
          bool slot_enabled = false;
          bool day_enabled = false;
          int scheduled_hour = -1;
          int scheduled_minute = -1;
          int scheduled_second = -1;

          // Select the program's watering settings.
          switch (program) {
              // Program 1: check its settings.
              case 1:
                program_enabled = id(prog1_enable).state;
                // Check whether today is an enabled watering day.
                switch (now.day_of_week) {
                  case 1: day_enabled = id(prog1_water_sunday).state; break;
                  case 2: day_enabled = id(prog1_water_monday).state; break;
                  case 3: day_enabled = id(prog1_water_tuesday).state; break;
                  case 4: day_enabled = id(prog1_water_wednesday).state; break;
                  case 5: day_enabled = id(prog1_water_thursday).state; break;
                  case 6: day_enabled = id(prog1_water_friday).state; break;
                  case 7: day_enabled = id(prog1_water_saturday).state; break;
                  default: break;
                }
                // Get the selected start slot's enabled state and time.
                switch (slot) {
                  case 1: {
                    slot_enabled = id(prog1_enable_start_time_1).state;
                    // Read its locally stored time.
                    // Copy time fields for the common match check.
                    const auto scheduled = id(prog1_start_time_1).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 2: {
                    slot_enabled = id(prog1_enable_start_time_2).state;
                    const auto scheduled = id(prog1_start_time_2).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 3: {
                    slot_enabled = id(prog1_enable_start_time_3).state;
                    const auto scheduled = id(prog1_start_time_3).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 4: {
                    slot_enabled = id(prog1_enable_start_time_4).state;
                    const auto scheduled = id(prog1_start_time_4).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  default: return;
                }
                break;
              // Program 2: use Program 2 settings.
              case 2:
                program_enabled = id(prog2_enable).state;
                switch (now.day_of_week) {
                  case 1: day_enabled = id(prog2_water_sunday).state; break;
                  case 2: day_enabled = id(prog2_water_monday).state; break;
                  case 3: day_enabled = id(prog2_water_tuesday).state; break;
                  case 4: day_enabled = id(prog2_water_wednesday).state; break;
                  case 5: day_enabled = id(prog2_water_thursday).state; break;
                  case 6: day_enabled = id(prog2_water_friday).state; break;
                  case 7: day_enabled = id(prog2_water_saturday).state; break;
                  default: break;
                }
                switch (slot) {
                  case 1: {
                    slot_enabled = id(prog2_enable_start_time_1).state;
                    const auto scheduled = id(prog2_start_time_1).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 2: {
                    slot_enabled = id(prog2_enable_start_time_2).state;
                    const auto scheduled = id(prog2_start_time_2).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 3: {
                    slot_enabled = id(prog2_enable_start_time_3).state;
                    const auto scheduled = id(prog2_start_time_3).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 4: {
                    slot_enabled = id(prog2_enable_start_time_4).state;
                    const auto scheduled = id(prog2_start_time_4).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  default: return;
                }
                break;
              // Program 3: use Program 3 settings.
              case 3:
                program_enabled = id(prog3_enable).state;
                switch (now.day_of_week) {
                  case 1: day_enabled = id(prog3_water_sunday).state; break;
                  case 2: day_enabled = id(prog3_water_monday).state; break;
                  case 3: day_enabled = id(prog3_water_tuesday).state; break;
                  case 4: day_enabled = id(prog3_water_wednesday).state; break;
                  case 5: day_enabled = id(prog3_water_thursday).state; break;
                  case 6: day_enabled = id(prog3_water_friday).state; break;
                  case 7: day_enabled = id(prog3_water_saturday).state; break;
                  default: break;
                }
                switch (slot) {
                  case 1: {
                    slot_enabled = id(prog3_enable_start_time_1).state;
                    const auto scheduled = id(prog3_start_time_1).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 2: {
                    slot_enabled = id(prog3_enable_start_time_2).state;
                    const auto scheduled = id(prog3_start_time_2).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 3: {
                    slot_enabled = id(prog3_enable_start_time_3).state;
                    const auto scheduled = id(prog3_start_time_3).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  case 4: {
                    slot_enabled = id(prog3_enable_start_time_4).state;
                    const auto scheduled = id(prog3_start_time_4).state_as_esptime();
                    scheduled_hour = scheduled.hour;
                    scheduled_minute = scheduled.minute;
                    scheduled_second = scheduled.second;
                    break;
                  }
                  default: return;
                }
                break;
            default:
              ESP_LOGW("scheduler", "Invalid program %d", program);
              return;
          }

          // Reject an outdated callback after a clock adjustment, or a time
          // value edited after the callback was scheduled.
          if (now.hour != scheduled_hour ||
              now.minute != scheduled_minute ||
              now.second != scheduled_second) {
            ESP_LOGW("scheduler", "P%d slot %d skipped: stale time match", program, slot);
            return;
          }

          if (!program_enabled || !slot_enabled || !day_enabled) {
            ESP_LOGI("scheduler",
                     "P%d slot %d blocked: program=%s, slot=%s, weekday=%s",
                     program, slot,
                     program_enabled ? "on" : "off",
                     slot_enabled ? "on" : "off",
                     day_enabled ? "on" : "off");
            return;
          }

          ESP_LOGI("scheduler", "P%d slot %d: schedule match, requesting start", program, slot);
          if (program == 1) {
            id(prog1_run_sprinkler_cycle).execute();
          } else if (program == 2) {
            id(prog2_run_sprinkler_cycle).execute();
          } else {
            id(prog3_run_sprinkler_cycle).execute();
          }


  # Turns on the status LED if there is a program runnings
  - id: update_status_led
    then:

      - logger.log:
          tag: "led"
          format: "Status LED script triggered"
          level: INFO

      - lambda: |-
          bool running = false;
          // Check if any program is running (i.e. not in the IDLE state)
          if (id(esprinkler_prog1)->controller_state() != esphome::sprinkler::SprinklerState::IDLE) {
            running = true;
          } else if (id(esprinkler_prog2)->controller_state() != esphome::sprinkler::SprinklerState::IDLE) {
            running = true;
          } else if (id(esprinkler_prog3)->controller_state() != esphome::sprinkler::SprinklerState::IDLE) {
            running = true;
          }
          if (running) {
            id(status_led_out).turn_on();
          } else {
            id(status_led_out).turn_off();
          }

  # Controls the wifi LED using flashing patterns, a single pulse indicates a connection, multiple pulses indicates
  # no connection
  - id: update_wifi_led
    then:
      - logger.log:
          tag: "WIFI"
          format: "WIFI LED script triggered"
          level: INFO

      # If wifi is connected, flash every second
      - if:
          condition:
            wifi.connected:
          then:

            - logger.log:
                tag: "WIFI"
                format: "WIFI is connected!"
                level: INFO

            - output.turn_on:
                id: wifi_led_out

          # If wifi is not connected, flash the LED regularly
          else:
            - repeat:
                count: 3
                then:
                  - logger.log:
                      tag: "WIFI"
                      format: "WIFI is dicconnected!"
                      level: INFO

                  - output.turn_on:
                      id: wifi_led_out
                  - delay: 200ms
                  - output.turn_off:
                      id: wifi_led_out
                  - delay: 200ms



  #######################
  # Sprinkler Scripts
  #######################

  ###############
  # Program 1
  ###############

  # Update next scheduled cycle sensor
  - id: prog1_update_next_watering_schedule
    then:
      - lambda: |-
          // This lambda calculates the next scheduled watering day and time.
          // It iterates over the next 7 days, checking if watering is enabled for that day (using the day switches),
          // and then examines each enabled scheduled time.
          // For today (i = 0), only scheduled times that haven't yet passed are considered.
          // It returns a string like "Saturday at 04:30" for the next upcoming watering event.

          // Calculate the next watering event over the next 7 days.
          auto now = id(ha_time).now();
          int now_minutes = now.hour * 60 + now.minute;
          
          // Convert current time to a struct tm for the weekday.
          struct tm t;
          t.tm_year = now.year - 1900;
          t.tm_mon  = now.month - 1;
          t.tm_mday = now.day_of_month;
          t.tm_hour = now.hour;
          t.tm_min  = now.minute;
          t.tm_sec  = now.second;
          t.tm_isdst = -1;
          mktime(&t);
          int current_wday = t.tm_wday;
          
          // Variables to keep track of the best candidate event.
          int best_diff = 100000; // large initial value
          int best_candidate_day = -1;
          int best_candidate_sched = -1;
          bool found = false;
          
          // Helper lambda to check a candidate scheduled time for a given day offset.
          auto check_sched = [&](int day_offset, int scheduled_minutes) {
              // For today, only consider scheduled times that haven't passed.
              if(day_offset == 0 && scheduled_minutes < now_minutes)
                  return;
              int diff = day_offset * 1440 + scheduled_minutes - now_minutes;
              if(diff < best_diff) {
                  best_diff = diff;
                  best_candidate_sched = scheduled_minutes;
                  best_candidate_day = (current_wday + day_offset) % 7;
                  found = true;
              }
          };
          
          // Iterate over the next 7 days.
          for (int i = 0; i < 7; i++) {
              int day_index = (current_wday + i) % 7;
              bool day_enabled = false;
              
              if(day_index == 0) { day_enabled = id(prog1_water_sunday).state; }
              else if(day_index == 1) { day_enabled = id(prog1_water_monday).state; }
              else if(day_index == 2) { day_enabled = id(prog1_water_tuesday).state; }
              else if(day_index == 3) { day_enabled = id(prog1_water_wednesday).state; }
              else if(day_index == 4) { day_enabled = id(prog1_water_thursday).state; }
              else if(day_index == 5) { day_enabled = id(prog1_water_friday).state; }
              else if(day_index == 6) { day_enabled = id(prog1_water_saturday).state; }
              
              if(!day_enabled)
                  continue;  // Skip days when watering is not enabled.
              
              // For each enabled scheduled time, calculate its candidate time.
              if (id(prog1_enable_start_time_1).state) {
                  auto t = id(prog1_start_time_1).state_as_esptime();
                  int sched_minutes = t.hour * 60 + t.minute;
                  check_sched(i, sched_minutes);
              }
              if (id(prog1_enable_start_time_2).state) {
                  auto t = id(prog1_start_time_2).state_as_esptime();
                  int sched_minutes = t.hour * 60 + t.minute;
                  check_sched(i, sched_minutes);
              }
              if (id(prog1_enable_start_time_3).state) {
                  auto t = id(prog1_start_time_3).state_as_esptime();
                  int sched_minutes = t.hour * 60 + t.minute;
                  check_sched(i, sched_minutes);
              }
              if (id(prog1_enable_start_time_4).state) {
                  auto t = id(prog1_start_time_4).state_as_esptime();
                  int sched_minutes = t.hour * 60 + t.minute;
                  check_sched(i, sched_minutes);
              }
          }
          
          if (!found) {
              id(prog1_next_watering_schedule).publish_state("None");
              return;
          }
          
          // Array mapping weekday indexes to names.
          const char* day_names[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
          
          int hh = best_candidate_sched / 60;
          int mm = best_candidate_sched % 60;
          char buf[32];
          sprintf(buf, "%s at %02d:%02d", day_names[best_candidate_day], hh, mm);
          id(prog1_next_watering_schedule).publish_state(std::string(buf));


  # Check if program 1 is enabled
  # Attempt to run program cycle 1
  - id: prog1_run_sprinkler_cycle
    then:
      - logger.log:
          tag: "script"
          format: "Attempting to start irrigation program."
          level: INFO
      - if:
          condition:
            lambda: |-
              // Prevent stale/duplicate scheduling requests and unintended
              // simultaneous operation of controllers sharing physical outputs.
              const auto now = id(ha_time).now();
              if (!now.is_valid()) {
                ESP_LOGW("scheduler", "P1 skipped: clock is not valid");
                return false;
              }
              const int64_t minute = static_cast<int64_t>(now.timestamp) / 60;
              if (id(prog1_last_scheduled_start_minute) == minute) {
                ESP_LOGI("scheduler", "P1 skipped: already started in this minute");
                return false;
              }

              using esphome::sprinkler::SprinklerState;
              if (id(esprinkler_prog1).controller_state() != SprinklerState::IDLE ||
                  id(esprinkler_prog2).controller_state() != SprinklerState::IDLE ||
                  id(esprinkler_prog3).controller_state() != SprinklerState::IDLE) {
                ESP_LOGW("scheduler", "P1 skipped: another controller is active");
                return false;
              }
              // start_full_cycle would enable all zones if none are selected.
              if (id(esprinkler_prog1).total_cycle_time_enabled_valves() == 0) {
                ESP_LOGW("scheduler", "P1 skipped: no zones are enabled");
                return false;
              }

              // Set before start_full_cycle so concurrent slot triggers cannot
              // request a second cycle within the same minute.
              id(prog1_last_scheduled_start_minute) = minute;
              return true;
          then:
            - logger.log:
                tag: "script"
                format: "No active cycle detected, starting full cycle."
                level: INFO
            - sprinkler.start_full_cycle: esprinkler_prog1
            - script.execute: update_status_led
          else:
            - logger.log:
                tag: "script"
                format: "Cycle already running; skipping new start"
                level: INFO

