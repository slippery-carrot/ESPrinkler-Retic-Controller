  - platform: template
    name: "Indicator LED Brightness"
    id: indicator_led_brightness
    icon: "mdi:brightness-6"
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 25
    restore_value: true
    optimistic: true
    entity_category: config

    # set_action only runs when the value is changed by Home Assistant.
    # Boot restoration is handled separately in esphome.on_boot above.
    set_action:
      - output.set_max_power:
          id: wifi_led_out
          max_power: !lambda |-
            return x / 100.0f;

      - output.set_max_power:
          id: status_led_out
          max_power: !lambda |-
            return x / 100.0f;

      # set_max_power changes the scaling value but does not rewrite an output
      # which is already on, so refresh the existing status scripts immediately.
      - script.execute: update_status_led
      - script.execute: update_wifi_led

###################################
