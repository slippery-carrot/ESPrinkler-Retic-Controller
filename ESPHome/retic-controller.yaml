###################################
# Binary sensor component
###################################
binary_sensor:
  - platform: status
    name: "Connection Status"

###################################
# Time component
###################################
time:

  # Set up time using HA as the source
  - platform: homeassistant
    id: ha_time

    # Trigger every minute
    on_time: 
      - seconds: 0
        minutes: "*"
        then:

          # Native datetime.on_time handles all 12 program start slots.
          # This minute trigger now updates only the informational schedule sensors.
          # Update Next Watering Schedule sensor

          # Program 1
          - script.execute: prog1_update_next_watering_schedule

          # Program 2
          - script.execute: prog2_update_next_watering_schedule

          # Program 3
          - script.execute: prog3_update_next_watering_schedule




###################################
# Date/time component
###################################
datetime:

  # Date/Time inputs to choose the program start times 1 - 4

  # Program 1

  - platform: template
    id: prog1_start_time_1
    type: time
    name: "Program 1 Schedule Start Time 1"
    optimistic: true
    restore_value: true
    initial_value: "00:00"
    entity_category: config # Force entity to be in the config category

    # Native local-time trigger. Home Assistant only edits this stored time.
    time_id: ha_time
    on_time:
      then:
        - script.execute:
            id: scheduler_evaluate_start
            program: 1
            slot: 1

