    id: prog3_start_time_3
    type: time
    name: "Program 3 Schedule Start Time 3"
    optimistic: true
    restore_value: true
    initial_value: "00:00"
    entity_category: config # Force entity to be in the config category

    # Native local-time trigger. The shared evaluator checks weekdays and enables.
    time_id: ha_time
    on_time:
      then:
        - script.execute:
            id: scheduler_evaluate_start
            program: 3
            slot: 3

  - platform: template
    id: prog3_start_time_4
    type: time
    name: "Program 3 Schedule Start Time 4"
    optimistic: true
    restore_value: true
    initial_value: "00:00"
    entity_category: config # Force entity to be in the config category

    # Native local-time trigger. The shared evaluator checks weekdays and enables.
    time_id: ha_time
    on_time:
      then:
        - script.execute:
            id: scheduler_evaluate_start
            program: 3
            slot: 4

