type: sections
max_columns: 1
icon: mdi:sprinkler-variant
path: esprinkler-configuration
title: ESPrinkler Configuration
sections:
  - type: grid
    cards:
      - type: heading
        icon: mdi:sprinkler-variant
        heading: Retic Overview
        heading_style: title
        badges: []
        visibility:
          - condition: or
            conditions:
              - condition: state
                entity: switch.esprinkler_retic_controller_enable_program_1
                state: "on"
              - condition: state
                entity: switch.esprinkler_retic_controller_enable_program_2
                state: "on"
              - condition: state
                entity: switch.esprinkler_retic_controller_enable_program_3
                state: "on"
      - type: conditional
        conditions:
          - condition: state
            entity: switch.esprinkler_retic_controller_enable_program_1
            state: "on"
        card:
          type: entities
          entities:
            - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
              icon: mdi:information-outline
              name: Program 1 State
            - entity: >-
                sensor.esprinkler_retic_controller_program_1_next_watering_schedule
              name: Program 1 Next Schedule
              icon: mdi:information-outline
            - type: conditional
              conditions:
                - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
                  state_not: Idle
              row:
                entity: >-
                  sensor.esprinkler_retic_controller_program_1_total_watering_duration
                name: Program 1 Time Remaining
            - type: conditional
              conditions:
                - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
                  state_not: Idle
              row:
                entity: >-
                  sensor.esprinkler_retic_controller_program_1_current_zone_remaining_time
                name: Current Zone Time Remaining
            - type: conditional
              conditions:
                - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
                  state_not: Idle
              row:
                entity: sensor.esprinkler_retic_controller_currently_running_zone
                name: Current Active Zone
            - type: conditional
              conditions:
                - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
                  state: Idle
              row:
                entity: button.esprinkler_retic_controller_start_program_1
                name: Start Program 1
            - type: conditional
              conditions:
                - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
                  state_not: Idle
              row:
                entity: button.esprinkler_retic_controller_pause_program_1
                name: Pause Program 1
            - type: conditional
              conditions:
                - entity: sensor.esprinkler_retic_controller_program_1_sprinkler_state
                  state_not: Idle
              row:
                entity: button.esprinkler_retic_controller_stop_program_1
                name: Stop Program 1
